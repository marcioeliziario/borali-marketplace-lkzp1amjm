name: CI Borali

on:
 pull_request:
 branches: [main, development-integrado]
 push:
 branches: [development-integrado]

jobs:
 validate:
 runs-on: ubuntu-latest
 steps:
 - name: Checkout code
 uses: actions/checkout@v4

 - name: Setup pnpm
 uses: pnpm/action-setup@v4
 with:
 version: 9

 - name: Setup Node.js
 uses: actions/setup-node@v4
 with:
 node-version: '20'
 cache: 'pnpm'

 - name: Install dependencies
 run: pnpm install --frozen-lockfile

 - name: Lint
 run: pnpm lint

 - name: Typecheck
 run: npx tsc --noEmit

 - name: Build
 run: pnpm build

 - name: Run tests (placeholder)
 run: echo "Automated tests pending implementation" && exit 0
name: CI Borali
on:
 pull_request:
 branches: [main, development-integrado]
 push:
 branches: [audit/consolidacao-borali]
 workflow_dispatch:
permissions:
 contents: read
jobs:
 validate:
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v4
 - uses: pnpm/action-setup@v4
 with:
 version: 10
 - uses: actions/setup-node@v4
 with:
 node-version: '20'
 cache: pnpm
 - run: pnpm install --frozen-lockfile
 - run: pnpm lint
 - run: pnpm exec tsc --noEmit
 - run: pnpm build
 # Testes de homologação exigem PocketBase local — desativados no CI até configuração adequada
 # - name: Run homologation tests
 # run: bash scripts/setup-homologation.sh